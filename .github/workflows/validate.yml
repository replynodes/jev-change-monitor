name: validate

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
      - name: Fixture determinism
        run: python3 scripts/generate_dataset.py --check
      - name: Full validation
        run: jev-monitor validate
      - name: Redaction integrity + rubric citations
        run: jev-monitor redact-check
      - name: Deterministic benchmark (held-out)
        run: jev-monitor benchmark --split held_out --provider heuristic
      - name: Reproducibility check
        run: jev-monitor repro-check --split held_out
      - name: Webhook contract roundtrip
        run: jev-monitor webhook-demo
      - name: Secret scan
        run: bash scripts/secret_scan.sh
      - name: Whitespace hygiene
        run: git diff --check