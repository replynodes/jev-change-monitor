[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-change-monitor"
version = "0.1.0"
description = "Typed website-change events and reproducible detector-level benchmarks for price, SaaS pricing, and product-change monitoring with Jev."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ReplyNodes", email = "dnanh2011@gmail.com" }]
dependencies = [
    "jsonschema>=4.18",
]

[project.scripts]
jev-monitor = "jev_change_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_change_monitor = ["py.typed"]